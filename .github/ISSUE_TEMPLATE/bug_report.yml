name: Bug report
description: Something on the board or in the post view is broken.
title: "[bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste API tokens, private feed URLs, or
        personal OPML contents. Security issues go through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Feed mode
      options:
        - Demo data
        - Direct feed
        - Local proxy
        - FreshRSS
        - Miniflux
        - Other / not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the board
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors or screenshots
      description: Redact tokens, private URLs, and personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed tokens and private feed URLs from logs and screenshots.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
