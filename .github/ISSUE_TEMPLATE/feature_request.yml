name: Feature request
description: Suggest a focused improvement that fits the demo and the static build.
title: "[feat] "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        This is a small, maintainer-led tech demo. Accounts, hosted services,
        analytics, and a public CORS proxy are out of scope. See docs/ROADMAP.md.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the reading or maintenance problem, not just the UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep it as small as possible. Mention alternatives you considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Board / cards
        - Post view
        - Feeds / transports
        - OPML / import
        - Accessibility
        - Performance
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This works in a static site with no accounts.
          required: true
        - label: This does not require shipping game assets or a public CORS proxy.
          required: true
