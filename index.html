<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Inter-Knot Board is a static, board-style RSS reader inspired by Zenless Zone Zero. A tech demo, not a service."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Inter-Knot Board — a static RSS reader demo</title>
  </head>
  <body>
    <div class="ik-backdrop" aria-hidden="true">
      <svg
        viewBox="0 0 1000 620"
        preserveAspectRatio="xMidYMid slice"
        role="presentation"
      >
        <defs>
          <pattern
            id="ik-backdrop-hatch"
            width="7"
            height="7"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)"
          >
            <rect width="7" height="7" fill="#1c1d1c"></rect>
            <line
              x1="0"
              y1="0"
              x2="0"
              y2="7"
              stroke="#161515"
              stroke-width="2"
            ></line>
          </pattern>
        </defs>
        <g fill="url(#ik-backdrop-hatch)" transform="rotate(-20 500 310)">
          <text
            class="ik-backdrop__line"
            x="-20"
            y="230"
            textLength="1040"
            lengthAdjust="spacingAndGlyphs"
          >
            INTERKNOT
          </text>
          <text
            class="ik-backdrop__line"
            x="30"
            y="390"
            textLength="1040"
            lengthAdjust="spacingAndGlyphs"
          >
            NETWORK
          </text>
          <text class="ik-backdrop__tag" x="500" y="470" text-anchor="middle">
            THE PROXY NETWORK
          </text>
        </g>
      </svg>
    </div>
    <ik-app></ik-app>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif; color: #f4f3ee">
        Inter-Knot Board is a client-side application and needs JavaScript to
        run. The source is available on GitHub.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
